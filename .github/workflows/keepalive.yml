# Supabase 무료 플랜 자동 일시정지 방지
# 3일마다 브검 단가 표(bs_rates)를 1줄 읽어서 "사용 중" 상태를 유지합니다.
# 접속 주소와 키는 assets/config.js 에서 읽으므로, 키가 바뀌어도 이 파일은 고칠 필요가 없습니다.
name: Supabase keep-alive

on:
  schedule:
    - cron: "0 0 */3 * *"   # 3일마다 오전 9시(한국 시간)쯤 실행
  workflow_dispatch:          # Actions 화면에서 직접 실행 버튼

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Supabase 접속
        run: |
          URL=$(grep -o 'SUPABASE_URL *= *"[^"]*"' assets/config.js | sed 's/.*"\(.*\)"/\1/')
          KEY=$(grep -o 'SUPABASE_KEY *= *"[^"]*"' assets/config.js | sed 's/.*"\(.*\)"/\1/')
          if [ -z "$URL" ] || [ -z "$KEY" ]; then
            echo "assets/config.js 에서 접속 정보를 찾지 못했습니다."; exit 1
          fi
          AUTH=()
          case "$KEY" in sb_*) ;; *) AUTH=(-H "Authorization: Bearer $KEY");; esac
          CODE=$(curl -sS --retry 3 --retry-delay 10 -o /tmp/res.txt -w "%{http_code}" \
            "${URL%/}/rest/v1/bs_rates?select=id&limit=1" -H "apikey: $KEY" "${AUTH[@]}")
          echo "응답 코드: $CODE"
          if [ "$CODE" != "200" ]; then
            echo "Supabase 접속 실패. 프로젝트가 일시정지됐는지 대시보드에서 확인해 주세요."
            cat /tmp/res.txt; exit 1
          fi
          echo "접속 성공"
